name: corpus
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Every corpus entry is a widely reviewed repository pinned to a commit,
      # so the commands kibble executes here cannot change under us. Adding an
      # entry means having read its documentation and verified the expected
      # counts by hand first.
      - name: Run kibble against the corpus
        shell: bash
        run: |
          set -uo pipefail
          go build -o /tmp/kibble .
          status=0
          while IFS=$'\t' read -r name url sha expect; do
            case "$name" in ""|\#*) continue ;; esac
            echo "::group::${name}"
            dir="/tmp/corpus/${name}"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "$url" "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
            # A run has three possible shapes and the comparison below only
            # understands two of them. The counts either match the pin or they
            # moved, and a moved count is a question about judgment that a
            # person has to answer. The third shape is a run that never
            # produced a comparable answer, because the runner or the network
            # failed under it. Folding that into "verdicts moved" is what makes
            # this job cry wolf, and a corpus that cries wolf stops being
            # believed, which costs more than the flake did.
            #
            # The discriminator is not the row type on its own. A TIMEOUT can
            # be perfectly stable: ripgrep's FAQ documents a search that never
            # returns, and that row is part of its pinned answer. What marks a
            # run inconclusive is a count that moved AND an unsettled row to
            # explain the move. Counts that match are accepted whatever rows
            # they contain, so a pinned TIMEOUT never blocks a green run.
            attempts=3
            inconclusive=""
            for attempt in $(seq 1 "$attempts"); do
              inconclusive=""
              rc=0
              /tmp/kibble -json "$dir" > "/tmp/${name}.json" || rc=$?
              # Exit 1 is kibble reporting failures, which is a verdict. Any
              # other nonzero is kibble unable to do its job, and blaming the
              # corpus for that would be the same mistake as blaming the docs.
              if [ "$rc" -gt 1 ] || ! jq -e 'type=="array"' "/tmp/${name}.json" >/dev/null 2>&1; then
                inconclusive="kibble itself failed (exit ${rc})"
                echo "${name}: attempt ${attempt} of ${attempts} was inconclusive: ${inconclusive}"
                continue
              fi
              got=$(jq -r '[([.[]|select(.status=="VERIFIED")]|length),
                            ([.[]|select(.status=="FAIL")]|length),
                            ([.[]|select(.status=="GAP")]|length)]
                           | map(tostring) | join(",")' \
                    "/tmp/${name}.json")
              [ "$got" = "$expect" ] && break
              # The counts moved. Only an unsettled row can excuse that as the
              # runner rather than a judgment change, and ERROR is the only
              # status that means kibble itself could not do the work.
              unsettled=$(jq -r '[.[] | select(.status == "ERROR")]
                                | if length == 0 then ""
                                  else "\(length) row(s) kibble could not run: "
                                       + (map("\(.status) \(.kind)") | join("; "))
                                  end' "/tmp/${name}.json")
              [ -z "$unsettled" ] && break
              inconclusive="counts ${got} against pin ${expect}, with ${unsettled}"
              echo "${name}: attempt ${attempt} of ${attempts} was inconclusive: ${inconclusive}"
            done
            if [ -n "$inconclusive" ]; then
              echo "::error::${name}: inconclusive after ${attempts} attempts: ${inconclusive}"
              echo "  This is the runner or the network, not a verdict that moved."
              echo "  The pin for ${name} is untested by this run."
              jq -r '.[]|"    \(.status)\t\(.kind)\t\(.detail // "")"' "/tmp/${name}.json"
              status=1
              echo "::endgroup::"
              continue
            fi
            # The status is VERIFIED, not PASS. It was PASS until the verdict
            # taxonomy was rewritten, and this line was not, so the comparison
            # counted a status nothing emits and every row read as drifted.
            if [ "$got" != "$expect" ]; then
              echo "::error::${name}: verdicts moved: expected ${expect} (pass,fail,gap), got ${got}"
              # A moved count says a verdict changed and not which one, so the
              # rows are printed here. Reading them is the whole job of anyone
              # who has to decide whether the new verdict is the better one,
              # and without them that person has to reproduce the run first.
              jq -r '.[]|"    \(.status)\t\(.kind)\t\(.detail // "")"' "/tmp/${name}.json"
              status=1
            else
              echo "${name}: ${got} as expected"
            fi
            echo "::endgroup::"
          done < corpus/repos.tsv
          # Kept whatever the counts said. A count that moved is a question
          # about judgment, and answering it needs the per-line evidence rather
          # than the totals the log already carried.
          exit "$status"
      - name: Keep the verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-verdicts
          path: /tmp/*.json
          if-no-files-found: ignore
      # Each mutation row corrupts one documented line of a pinned repository
      # and asserts kibble reaches the expected verdict on the damage. The
      # healthy counts above prove kibble does not cry wolf; these prove rot
      # cannot pass silently. A mutation kibble misses is a broken line it
      # would have shipped green.
      - name: Run kibble against mutated documentation
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          test -x /tmp/kibble || go build -o /tmp/kibble .
          status=0
          row=0
          while IFS=$'\t' read -r name url sha file find replace want proof; do
            case "$name" in ""|\#*) continue ;; esac
            row=$((row + 1))
            echo "::group::${name} (mutation ${row})"
            dir="/tmp/mutants/${row}-${name}"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 "$url" "$sha"
            git -C "$dir" checkout -q "$sha"
            FILE="$dir/$file" FIND="$find" REPLACE="$replace" python3 - <<'MUTATE'
          import io, os
          path = os.environ["FILE"]
          s = io.open(path, encoding="utf-8").read()
          find = os.environ["FIND"]
          if find not in s:
              raise SystemExit(f"mutation target not found: {find!r}")
          io.open(path, "w", encoding="utf-8").write(s.replace(find, os.environ["REPLACE"]))
          MUTATE
            rc=0
            /tmp/kibble -json "$dir" > "/tmp/mutant-${row}.json" || rc=$?
            if [ "$rc" -gt 1 ] || ! jq -e 'type=="array"' "/tmp/mutant-${row}.json" >/dev/null 2>&1; then
              echo "::error::${name}: kibble itself failed (exit ${rc}), no verdicts to compare"
              status=1
              echo "::endgroup::"
              continue
            fi
            wantStatus="${want%%=*}"
            wantCount="${want##*=}"
            got=$(jq -r --arg s "$wantStatus" \
                  '[.[]|select(.status==$s)]|length' "/tmp/mutant-${row}.json")
            named=$(jq -r --arg s "$wantStatus" --arg p "$proof" \
                  '[.[]|select(.status==$s and ((.detail // "")|contains($p)))]|length' \
                  "/tmp/mutant-${row}.json")
            if [ "$got" != "$wantCount" ] || [ "$named" -lt 1 ]; then
              echo "::error::${name}: mutating ${find@Q} must yield ${want} naming ${proof@Q}, got ${wantStatus}=${got} named=${named}"
              status=1
            else
              echo "${name}: ${want} naming ${proof} as expected"
            fi
            echo "::endgroup::"
          done < corpus/mutations.tsv
          exit "$status"
