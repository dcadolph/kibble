name: release

on:
  push:
    # Only version tags. The v1 alias moves to every release, and matching it
    # here built a second, wrongly named set of archives and filed them under
    # a release nobody cut.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Pin the version rather than letting it be inferred. The v1 alias
          # points at the same commit as the release tag, and git describe
          # can pick either, which is how kibble_1_linux_amd64.tar.gz happens.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Move the v1 alias onto this release, so anyone pinned to it gets the
      # newest version. Forcing v1 does not re-run this workflow, since v1 is
      # not a version tag and the push trigger matches only those.
      - name: Move the v1 alias to this release
        run: |
          git tag -f v1 "${{ github.ref_name }}"
          git push -f origin v1
